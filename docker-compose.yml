services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teaching_scheduler
      POSTGRES_USER: teacher
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Chỉ định rõ -d để tránh pg_isready tự thử kết nối vào database trùng
      # tên user ("teacher") - database đó không tồn tại nên cứ 5s lại in ra
      # 1 dòng FATAL vô hại nhưng gây nhiễu log.
      test: ["CMD-SHELL", "pg_isready -U teacher -d teaching_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    restart: unless-stopped
    # Dùng runserver khi dev để có auto-reload; đổi sang CMD trong Dockerfile khi deploy production
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Ghi đè DATABASE_URL của .env (vốn trỏ "localhost" để chạy ngoài Docker) -
      # bên trong mạng Docker phải gọi qua tên service "db", không phải localhost.
      DATABASE_URL: postgres://teacher:changeme@db:5432/teaching_scheduler
    depends_on:
      db:
        condition: service_healthy

  # Optional: chỉ cần nếu dùng Django-Q/Celery để chạy job tự sinh Session hàng tuần
  worker:
    build: ./backend
    restart: unless-stopped
    command: python manage.py qcluster
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://teacher:changeme@db:5432/teaching_scheduler
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: